{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card stat-card">
            <div class="card-body p-4">
                <h5><i class="bi bi-key"></i> {{ _d('change_pw_title') }}</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">{{ _d('current_pw') }}</label>
                        <input type="password" name="current" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _d('new_pw') }}</label>
                        <input type="password" name="new_password" class="form-control" required minlength="4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _d('confirm_pw') }}</label>
                        <input type="password" name="confirm" class="form-control" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-primary">{{ _d('change_pw_btn') }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
