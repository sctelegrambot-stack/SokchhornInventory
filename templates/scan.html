<!DOCTYPE html>
<html>
<head>
  <title>Scan Barcode</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { background: #f5f5f5; }
    .scan-box {
      max-width: 500px; margin: 80px auto; padding: 40px;
      background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .scan-box input {
      font-size: 28px; text-align: center; letter-spacing: 4px;
      height: 60px; border: 2px solid #ddd; border-radius: 10px;
      transition: border-color .2s;
    }
    .scan-box input:focus { border-color: #0d6efd; outline: none; box-shadow: 0 0 0 4px rgba(13,110,253,.15); }
    .scan-icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="scan-box">
      <div class="scan-icon">📷</div>
      <h4 class="mb-3">Scan Barcode</h4>
      <p class="text-muted mb-4">Scan a product code or IMEI barcode</p>
      <form method="POST" id="scanForm">
        <input type="text" name="value" id="scanInput" class="form-control" autofocus
               placeholder="Scan here..." autocomplete="off">
      </form>
    </div>
    <div class="text-center mt-3">
      <a href="{{ url_for('inventory') }}" class="text-muted">← Back to Inventory</a>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var input = document.getElementById('scanInput');
      input.focus();
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (this.value.trim()) document.getElementById('scanForm').submit();
        }
      });
      document.addEventListener('click', function() { input.focus(); });
    });
  </script>
</body>
</html>
