<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#2c3e50;display:flex;align-items:center;min-height:100vh}.card{border:none;border-radius:1rem}</style>
</head>
<body>
    <div class="container" style="max-width:450px">
        <div class="card shadow">
            <div class="card-body p-4">
                <h4 class="text-center mb-4"><i class="bi bi-shield-lock"></i> {{ _d('register_title') }}</h4>
                <p class="text-muted text-center small">First-time setup — create the admin account</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, msg in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                {% endfor %}{% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="mb-3">
                    <label class="form-label">{{ _d('username') }}</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _d('password') }}</label>
                    <input type="password" name="password" class="form-control" required minlength="4">
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _d('confirm_pw') }}</label>
                    <input type="password" name="confirm" class="form-control" required minlength="4">
                </div>
                <button type="submit" class="btn btn-primary w-100">{{ _d('register_btn') }}</button>
                </form>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
</body>
</html>
